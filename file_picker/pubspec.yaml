name: my_flutter_app
description: "A Flutter project for file picking example."
publish_to: 'none' # Keeps it private, not published to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons for iOS style
  cupertino_icons: ^1.0.8

  # HTTP client
  dio: ^5.9.2

  # File picker
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Add assets here if needed
  # assets:
  #   - assets/images/